name: Phase 4 pricing format fix

on:
  push:
    branches:
      - phase4-pricing-effective

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format pricing query indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/cab-selection/page.js")
          text = path.read_text()
          pattern = re.compile(r'(?m)^      // BUSINESS RULE: customer quotes must use the same effective pricing version\n// that the booking API will use at confirmation time\. Future scheduled versions\n// must never affect today\'s quote\.\nconst pricingNowIso = new Date\(\)\.toISOString\(\);\nconst \{ data: version, error: versionError \} = await supabase\n  \.from\("pricing_versions"\)\n  \.select\("id,version,status,effective_from"\)\n  \.eq\("status", "active"\)\n  \.lte\("effective_from", pricingNowIso\)\n  \.order\("effective_from", \{ ascending: false, nullsFirst: false \}\)\n  \.order\("version", \{ ascending: false \}\)\n  \.limit\(1\)\n  \.maybeSingle\(\);')
          replacement = '''      // BUSINESS RULE: customer quotes must use the same effective pricing version
      // that the booking API will use at confirmation time. Future scheduled versions
      // must never affect today's quote.
      const pricingNowIso = new Date().toISOString();
      const { data: version, error: versionError } = await supabase
        .from("pricing_versions")
        .select("id,version,status,effective_from")
        .eq("status", "active")
        .lte("effective_from", pricingNowIso)
        .order("effective_from", { ascending: false, nullsFirst: false })
        .order("version", { ascending: false })
        .limit(1)
        .maybeSingle();'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected formatting block not found (matches={count}).")
          path.write_text(text)
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/phase4-format-fix.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: format effective pricing query"
          git push