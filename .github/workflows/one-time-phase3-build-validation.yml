name: VOYNU Phase 3 build validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Remove temporary validation workflow
        if: success()
        run: |
          rm .github/workflows/one-time-phase3-build-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-time-phase3-build-validation.yml
          git commit -m "chore: remove temporary Phase 3 build validation workflow"
          git push
