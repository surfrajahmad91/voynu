name: VOYNU one-time app separation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  separate-app-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate application ownership
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting controlled VOYNU source separation..."

          test -f app/page.js
          test -d app/admin
          test -f app/driver/page.js
          test -f lib/capacityValidation.js

          mkdir -p apps/customer/app apps/customer/app/api/_lib apps/customer/lib
          mkdir -p apps/admin/app apps/admin/app/lib
          mkdir -p apps/driver/app apps/driver/app/components
          mkdir -p shared/components shared/lib shared/styles shared/api

          move_replace() {
            local src="$1"
            local dst="$2"
            mkdir -p "$(dirname "$dst")"
            if [ -e "$dst" ]; then
              git rm -rf -- "$dst"
            fi
            git mv -- "$src" "$dst"
          }

          # Customer route implementations replace the thin deployment wrappers.
          for p in account booking-confirmed cab-selection forgot-password login reset-password signup; do
            move_replace "app/$p/page.js" "apps/customer/app/$p/page.js"
          done
          move_replace app/page.js apps/customer/app/page.js

          # Customer-only UI and business libraries.
          for f in AccountLink.jsx AuthLanding.jsx AuthShell.jsx DateTimeBookingGuard.jsx LocationPicker.jsx MapLocationPicker.jsx PageHeader.jsx; do
            move_replace "app/components/$f" "apps/customer/app/components/$f"
          done
          for f in contact.js fareRules.js geofence.js googleMaps.js serviceAreas.js tripRules.js; do
            move_replace "app/lib/$f" "apps/customer/lib/$f"
          done
          move_replace lib/capacityValidation.js apps/customer/lib/capacityValidation.js

          # Admin route implementations and admin-only library.
          while IFS= read -r src; do
            rel="${src#app/admin/}"
            move_replace "$src" "apps/admin/app/admin/$rel"
          done < <(find app/admin -type f | sort)
          move_replace app/lib/admin.js apps/admin/app/lib/admin.js

          # Saarthi/driver route implementation and driver-only component.
          move_replace app/driver/page.js apps/driver/app/driver/page.js
          move_replace app/components/DriverNavigationMode.js apps/driver/app/components/DriverNavigationMode.js

          # Shared UI/runtime source.
          for f in NotificationBell.jsx PushNotifications.jsx LiveTripMap.js; do
            move_replace "app/components/$f" "shared/components/$f"
          done
          for f in supabaseClient.js theme.js; do
            move_replace "app/lib/$f" "shared/lib/$f"
          done
          move_replace app/globals.css shared/styles/globals.css
          move_replace app/brand-theme.css shared/styles/brand-theme.css

          # Shared road-distance implementation; app route wrappers stay app-owned.
          move_replace app/api/_lib/roadDistance.ts shared/api/roadDistance.ts
          move_replace app/api/_lib/sendBookingEmail.js apps/customer/app/api/_lib/sendBookingEmail.js

          # Customer booking API replaces its deployment wrapper.
          move_replace app/api/bookings/create/route.js apps/customer/app/api/bookings/create/route.js

          # These root API routes are obsolete duplicates; each production app already has its own route.
          git rm -rf -- app/api/route-distance app/api/route-map

          # Replace old root-source imports with stable shared aliases.
          find apps shared -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -print0 |
            xargs -0 perl -0pi -e 's#from\s+["\x27](?:\.\./)+lib/(theme|supabaseClient)["\x27]#from "@voynu/shared/lib/$1"#g; s#from\s+["\x27](?:\.\./)+components/(NotificationBell|PushNotifications|LiveTripMap)["\x27]#from "@voynu/shared/components/$1"#g; s#from\s+["\x27]\./(NotificationBell|PushNotifications|LiveTripMap)["\x27]#from "@voynu/shared/components/$1"#g'

          # Each app gets a small JS path-alias contract for the shared source tree.
          cat > apps/customer/jsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "baseUrl": ".",
              "paths": { "@voynu/shared/*": ["../../shared/*"] }
            }
          }
          EOF
          cat > apps/driver/jsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "baseUrl": ".",
              "paths": { "@voynu/shared/*": ["../../shared/*"] }
            }
          }
          EOF
          cat > apps/admin/jsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "baseUrl": ".",
              "paths": { "@voynu/shared/*": ["../../shared/*"] }
            }
          }
          EOF
          git add apps/customer/jsconfig.json apps/driver/jsconfig.json apps/admin/jsconfig.json

          # The existing app CSS entrypoints now import the shared design system directly.
          for app in customer driver admin; do
            perl -0pi -e 's#@import "\.\./\.\./\.\./app/globals\.css";#@import "../../../shared/styles/globals.css";#g; s#@import "\.\./\.\./\.\./app/brand-theme\.css";#@import "../../../shared/styles/brand-theme.css";#g' "apps/$app/styles/globals.css"
          done

          # Production layouts consume shared notification services without root-app imports.
          for app in customer driver admin; do
            perl -0pi -e 's#\.\./\.\./\.\./app/components/(NotificationBell|PushNotifications)#@voynu/shared/components/$1#g' "apps/$app/app/layout.js"
          done

          # Repoint the existing app-level road-distance wrappers to the shared implementation.
          cat > apps/customer/app/api/_lib/roadDistance.ts <<'EOF'
export { getRoadDistance } from "../../../../../shared/api/roadDistance";
export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
EOF
          cat > apps/driver/app/api/_lib/roadDistance.ts <<'EOF'
export { getRoadDistance } from "../../../../../shared/api/roadDistance";
export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
EOF

          # The app wrappers for the root routes must disappear now that the implementations are local.
          rm -f apps/customer/app/page.js.tmp

          # Strong post-move invariants: no executable source may depend on the deleted root app tree.
          if git grep -nE 'from ["\x27]\.\./.*app/|from ["\x27]\.\./\.\./.*app/' -- apps shared; then
            echo "ERROR: stale root-app imports remain."
            exit 1
          fi
          if [ -d app ] && find app -type f -print -quit | grep -q .; then
            echo "ERROR: root app still contains files."
            exit 1
          fi
          if [ -d lib ] && find lib -type f -print -quit | grep -q .; then
            echo "ERROR: root lib still contains files."
            exit 1
          fi

          # Remove empty legacy directories from the working tree (Git does not track empty dirs).
          rm -rf app lib

          # Show the exact ownership boundary before validation.
          echo "--- Customer implementation ---"
          find apps/customer/app apps/customer/lib -type f | sort
          echo "--- Saarthi implementation ---"
          find apps/driver/app -type f | sort
          echo "--- Admin implementation ---"
          find apps/admin/app -type f | sort
          echo "--- Shared implementation ---"
          find shared -type f | sort

          git status --short

      - name: Install and build all three apps
        shell: bash
        run: |
          set -euo pipefail
          for app in customer driver admin; do
            echo "=== Building $app ==="
            cd "apps/$app"
            npm install --no-audit --no-fund
            npm run build
            cd ../..
          done

      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/one-time-app-separation.yml
          git add -A
          git commit -m "refactor: complete three-app source separation"
          git push origin HEAD:main
