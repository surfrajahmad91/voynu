name: VOYNU source separation
on: push
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate and validate
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/page.js ]; then
            echo 'Source separation already completed or source tree is unexpected.'
            exit 0
          fi
          test -d app/admin
          test -f app/driver/page.js
          test -f lib/capacityValidation.js

          mkdir -p apps/customer/app/components apps/customer/app/api/_lib apps/customer/app/lib
          mkdir -p apps/admin/app/lib apps/driver/app/components
          mkdir -p shared/components shared/lib shared/styles shared/api shared/auth

          move_replace() {
            src="$1"; dst="$2"
            mkdir -p "$(dirname "$dst")"
            rm -rf -- "$dst"
            mv -- "$src" "$dst"
          }

          # Customer implementation routes replace the thin deployment wrappers.
          for p in account booking-confirmed cab-selection signup; do
            move_replace "app/$p/page.js" "apps/customer/app/$p/page.js"
          done
          move_replace app/page.js apps/customer/app/page.js

          # Authentication is shared by Customer and Saarthi.
          for p in login forgot-password reset-password; do
            move_replace "app/$p/page.js" "shared/auth/$p.js"
          done

          # Shared UI/runtime modules.
          for f in AccountLink.jsx AuthLanding.jsx AuthShell.jsx DateTimeBookingGuard.jsx LiveTripMap.js LocationPicker.jsx MapLocationPicker.jsx NotificationBell.jsx PageHeader.jsx PushNotifications.jsx; do
            move_replace "app/components/$f" "shared/components/$f"
          done
          for f in supabaseClient.js theme.js; do
            move_replace "app/lib/$f" "shared/lib/$f"
          done

          # Customer-only UI/business modules stay physically under Customer's app tree.
          for f in contact.js fareRules.js geofence.js googleMaps.js serviceAreas.js tripRules.js; do
            move_replace "app/lib/$f" "apps/customer/app/lib/$f"
          done
          move_replace lib/capacityValidation.js apps/customer/lib/capacityValidation.js

          # Admin route implementations and admin-only library.
          while IFS= read -r src; do
            rel="${src#app/admin/}"
            move_replace "$src" "apps/admin/app/admin/$rel"
          done < <(find app/admin -type f | sort)
          move_replace app/lib/admin.js apps/admin/app/lib/admin.js

          # Saarthi route implementation and driver-only component.
          move_replace app/driver/page.js apps/driver/app/driver/page.js
          move_replace app/components/DriverNavigationMode.js apps/driver/app/components/DriverNavigationMode.js

          # Customer booking API implementation and its mail helper are app-owned.
          move_replace app/api/_lib/sendBookingEmail.js apps/customer/app/api/_lib/sendBookingEmail.js
          move_replace app/api/bookings/create/route.js apps/customer/app/api/bookings/create/route.js

          # Road-distance implementation is genuinely shared; route wrappers remain inside each app.
          move_replace app/api/_lib/roadDistance.ts shared/api/roadDistance.ts
          rm -rf -- app/api/route-distance app/api/route-map

          # Shared module aliases are explicit in all three Next configs.
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          for (const app of ['customer', 'driver', 'admin']) {
            const file = `apps/${app}/next.config.js`;
            let text = fs.readFileSync(file, 'utf8');
            const marker = 'config.resolve.alias =';
            if (!text.includes(marker)) {
              text = text.replace(
                'config.resolve.modules = [',
                'config.resolve.alias = { ...(config.resolve.alias || {}), "@voynu/shared": path.join(__dirname, "../../shared") };\n    config.resolve.modules = ['
              );
              fs.writeFileSync(file, text);
            }
          }
          NODE

          # Keep editor/module-resolution metadata aligned with the same alias contract.
          for app in customer driver admin; do
            cat > "apps/$app/jsconfig.json" <<'EOF'
          {
            "compilerOptions": {
              "baseUrl": ".",
              "paths": { "@voynu/shared/*": ["../../shared/*"] }
            }
          }
          EOF
          done

          # Shared imports from the former root source are rewritten to the stable alias.
          find apps shared -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -print0 |
            xargs -0 perl -0pi -e 's#from\s+["\x27](?:\.\./)+app/lib/(theme|supabaseClient)["\x27]#from "@voynu/shared/lib/$1"#g; s#from\s+["\x27](?:\.\./)+app/components/(AccountLink|AuthLanding|AuthShell|NotificationBell|PushNotifications|LiveTripMap|PageHeader|DateTimeBookingGuard|LocationPicker|MapLocationPicker)["\x27]#from "@voynu/shared/components/$1"#g; s#from\s+["\x27](?:\.\./)+lib/(theme|supabaseClient)["\x27]#from "@voynu/shared/lib/$1"#g; s#from\s+["\x27](?:\.\./)+components/(AccountLink|AuthLanding|AuthShell|NotificationBell|PushNotifications|LiveTripMap|PageHeader|DateTimeBookingGuard|LocationPicker|MapLocationPicker)["\x27]#from "@voynu/shared/components/$1"#g; s#from\s+["\x27]\./(AccountLink|AuthLanding|AuthShell|NotificationBell|PushNotifications|LiveTripMap|PageHeader)["\x27]#from "@voynu/shared/components/$1"#g'

          # Shared auth routes are tiny app-local adapters; auth implementation stays in shared/auth.
          for app in customer driver; do
            for p in login forgot-password reset-password; do
              cat > "apps/$app/app/$p/page.js" <<EOF
          export { default } from "@voynu/shared/auth/$p";
          EOF
            done
          done

          # Admin login references the app-local admin library.
          perl -0pi -e 's#from ["\x27](?:\.\./)+app/lib/admin["\x27]#from "../lib/admin"#g' apps/admin/app/login/page.js

          # Customer layout owns the customer-only date/time guard.
          perl -0pi -e 's#from ["\x27]\.\./\.\./\.\./app/components/DateTimeBookingGuard["\x27]#from "./components/DateTimeBookingGuard"#g' apps/customer/app/layout.js

          # Shared CSS is imported directly by each app entrypoint.
          for app in customer driver admin; do
            perl -0pi -e 's#@import "\.\./\.\./\.\./app/globals\.css";#@import "../../../shared/styles/globals.css";#g; s#@import "\.\./\.\./\.\./app/brand-theme\.css";#@import "../../../shared/styles/brand-theme.css";#g' "apps/$app/styles/globals.css"
          done

          # App-level road-distance wrappers point at the shared implementation.
          cat > apps/customer/app/api/_lib/roadDistance.ts <<'EOF'
          export { getRoadDistance } from "../../../../../shared/api/roadDistance";
          export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
          EOF
          cat > apps/driver/app/api/_lib/roadDistance.ts <<'EOF'
          export { getRoadDistance } from "../../../../../shared/api/roadDistance";
          export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
          EOF

          rm -rf app lib
          git add -A

          if git grep -nE 'from ["\x27].*app/(lib|components)/' -- apps shared; then
            echo 'ERROR: stale root-app imports remain.'
            exit 1
          fi
          if git grep -nE 'from ["\x27].*app/(login|forgot-password|reset-password)' -- apps shared; then
            echo 'ERROR: stale root-auth imports remain.'
            exit 1
          fi
          if [ -d app ] && find app -type f -print -quit | grep -q .; then
            echo 'ERROR: root app still contains files.'
            exit 1
          fi
          if [ -d lib ] && find lib -type f -print -quit | grep -q .; then
            echo 'ERROR: root lib still contains files.'
            exit 1
          fi
          git status --short

      - name: Build all three applications
        shell: bash
        run: |
          set -euo pipefail
          for app in customer driver admin; do
            cd "apps/$app"
            npm install --no-audit --no-fund
            npm run build
            cd ../..
          done

      - name: Commit migration and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/voynu-source-separation.yml
          git add -A
          git commit -m 'refactor: complete three-app source separation'
          git push origin HEAD:main

# One-time controlled migration; self-removes after a successful validated commit.
