name: VOYNU source separation
on: push
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate and validate
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/page.js ]; then echo 'Source separation already completed or source tree is unexpected.'; exit 0; fi
          test -d app/admin
          test -f app/driver/page.js
          test -f lib/capacityValidation.js
          mkdir -p apps/customer/app/components apps/customer/app/api/_lib apps/customer/app/lib
          mkdir -p apps/admin/app/lib apps/driver/app/components
          mkdir -p shared/components shared/lib shared/styles shared/api shared/auth
          move_replace() { src="$1"; dst="$2"; mkdir -p "$(dirname "$dst")"; rm -rf -- "$dst"; mv -- "$src" "$dst"; }

          for p in account booking-confirmed cab-selection signup; do move_replace "app/$p/page.js" "apps/customer/app/$p/page.js"; done
          move_replace app/page.js apps/customer/app/page.js
          for p in login forgot-password reset-password; do move_replace "app/$p/page.js" "shared/auth/$p.js"; done
          for f in AccountLink.jsx AuthLanding.jsx AuthShell.jsx DateTimeBookingGuard.jsx LiveTripMap.js LocationPicker.jsx MapLocationPicker.jsx NotificationBell.jsx PageHeader.jsx PushNotifications.jsx; do move_replace "app/components/$f" "shared/components/$f"; done
          for f in supabaseClient.js theme.js; do move_replace "app/lib/$f" "shared/lib/$f"; done
          for f in contact.js fareRules.js geofence.js googleMaps.js serviceAreas.js tripRules.js; do move_replace "app/lib/$f" "apps/customer/app/lib/$f"; done
          move_replace lib/capacityValidation.js apps/customer/lib/capacityValidation.js

          while IFS= read -r src; do rel="${src#app/admin/}"; move_replace "$src" "apps/admin/app/admin/$rel"; done < <(find app/admin -type f | sort)
          move_replace app/lib/admin.js apps/admin/app/lib/admin.js
          move_replace app/driver/page.js apps/driver/app/driver/page.js
          move_replace app/components/DriverNavigationMode.js apps/driver/app/components/DriverNavigationMode.js
          move_replace app/api/_lib/sendBookingEmail.js apps/customer/app/api/_lib/sendBookingEmail.js
          move_replace app/api/bookings/create/route.js apps/customer/app/api/bookings/create/route.js
          move_replace app/api/_lib/roadDistance.ts shared/api/roadDistance.ts
          rm -rf -- app/api/route-distance app/api/route-map

          # Convert every former root-app import deterministically, regardless of relative depth.
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const sharedComponents = ['AccountLink','AuthLanding','AuthShell','DateTimeBookingGuard','LiveTripMap','LocationPicker','MapLocationPicker','NotificationBell','PageHeader','PushNotifications'];
          const sharedLibs = ['supabaseClient','theme'];
          function files(dir) {
            const out=[];
            for (const e of fs.readdirSync(dir,{withFileTypes:true})) {
              const p=path.join(dir,e.name);
              if (e.isDirectory()) out.push(...files(p));
              else if (/\.(js|jsx|ts|tsx)$/.test(e.name)) out.push(p);
            }
            return out;
          }
          for (const file of files(path.join(root,'apps')).concat(files(path.join(root,'shared')))) {
            let text=fs.readFileSync(file,'utf8');
            for (const name of sharedComponents) {
              const re=new RegExp(`from\\s+["'](?:\\.\\./)+app/components/${name}["']`,'g');
              text=text.replace(re, `from "${path.relative(path.dirname(file),path.join(root,'shared/components',name)).replaceAll(path.sep,'/').replace(/^([^\.])/,'./$1')}"`);
            }
            for (const name of sharedLibs) {
              const re=new RegExp(`from\\s+["'](?:\\.\\./)+app/lib/${name}["']`,'g');
              text=text.replace(re, `from "${path.relative(path.dirname(file),path.join(root,'shared/lib',name)).replaceAll(path.sep,'/').replace(/^([^\.])/,'./$1')}"`);
            }
            text=text.replace(/from\s+["'](?:\.\.\/)+app\/lib\/admin["']/g, 'from "../lib/admin"');
            fs.writeFileSync(file,text);
          }
          NODE

          for app in customer driver admin; do
            perl -0pi -e 's#@import "\.\./\.\./\.\./app/globals\.css";#@import "../../../shared/styles/globals.css";#g; s#@import "\.\./\.\./\.\./app/brand-theme\.css";#@import "../../../shared/styles/brand-theme.css";#g' "apps/$app/styles/globals.css"
          done

          cat > apps/customer/app/api/_lib/roadDistance.ts <<'EOF'
          export { getRoadDistance } from "../../../../../shared/api/roadDistance";
          export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
          EOF
          cat > apps/driver/app/api/_lib/roadDistance.ts <<'EOF'
          export { getRoadDistance } from "../../../../../shared/api/roadDistance";
          export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
          EOF

          rm -rf app lib
          git add -A
          if git grep -nE 'from ["\x27].*app/(lib|components)/' -- apps shared; then echo 'ERROR: stale root-app imports remain.'; exit 1; fi
          if git grep -nE 'from ["\x27].*app/(login|forgot-password|reset-password)' -- apps shared; then echo 'ERROR: stale root-auth imports remain.'; exit 1; fi
          if [ -d app ] && find app -type f -print -quit | grep -q .; then echo 'ERROR: root app still contains files.'; exit 1; fi
          if [ -d lib ] && find lib -type f -print -quit | grep -q .; then echo 'ERROR: root lib still contains files.'; exit 1; fi
          git status --short

      - name: Build all three applications
        shell: bash
        run: |
          set -euo pipefail
          for app in customer driver admin; do
            cd "apps/$app"
            npm install --no-audit --no-fund
            npm run build
            cd ../..
          done

      - name: Commit migration and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/voynu-source-separation.yml
          git add -A
          git commit -m 'refactor: complete three-app source separation'
          git push origin HEAD:main

# One-time controlled migration; self-removes after a successful validated commit.
