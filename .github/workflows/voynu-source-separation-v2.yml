name: VOYNU source separation v2

# Temporary one-shot migration. It runs on a same-repository PR so the
# migration can be built and audited before main is changed. The verified
# migration commit removes this workflow.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Migrate source tree and validate structure
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/page.js ]; then
            echo "Root source is already separated; no migration required."
            exit 0
          fi

          test -d app/admin
          test -f app/driver/page.js
          test -f lib/capacityValidation.js
          test -f app/lib/serviceAreas.js
          test -f app/lib/supabaseClient.js

          mkdir -p apps/customer/app/api/_lib apps/customer/app/{account,booking-confirmed,cab-selection,signup} apps/customer/{components,lib} apps/admin/app/admin apps/admin/lib apps/driver/app/{driver,api/_lib} apps/driver/{components,lib} shared/{components,lib,styles,api,auth}

          move_replace() {
            local src="$1" dst="$2"
            mkdir -p "$(dirname "$dst")"
            rm -rf -- "$dst"
            mv -- "$src" "$dst"
          }

          # Customer-owned routes, UI, and business logic.
          for p in account booking-confirmed cab-selection signup; do move_replace "app/$p/page.js" "apps/customer/app/$p/page.js"; done
          move_replace app/page.js apps/customer/app/page.js
          for f in AuthLanding.jsx DateTimeBookingGuard.jsx LocationPicker.jsx MapLocationPicker.jsx; do move_replace "app/components/$f" "apps/customer/components/$f"; done
          for f in contact.js fareRules.js geofence.js googleMaps.js serviceAreas.js tripRules.js; do move_replace "app/lib/$f" "apps/customer/lib/$f"; done
          move_replace lib/capacityValidation.js apps/customer/lib/capacityValidation.js

          # Shared authentication, UI, libraries, and styling.
          for p in login forgot-password reset-password; do move_replace "app/$p/page.js" "shared/auth/$p.js"; done
          for f in AccountLink.jsx AuthShell.jsx LiveTripMap.js NotificationBell.jsx PageHeader.jsx PushNotifications.jsx; do move_replace "app/components/$f" "shared/components/$f"; done
          for f in supabaseClient.js theme.js; do move_replace "app/lib/$f" "shared/lib/$f"; done
          move_replace app/globals.css shared/styles/globals.css
          move_replace app/brand-theme.css shared/styles/brand-theme.css

          # Admin-owned routes and helpers.
          mapfile -t admin_files < <(find app/admin -type f -print | sort)
          for src in "${admin_files[@]}"; do move_replace "$src" "apps/admin/app/admin/${src#app/admin/}"; done
          move_replace app/lib/admin.js apps/admin/lib/admin.js

          # Saarthi-owned routes and UI.
          move_replace app/driver/page.js apps/driver/app/driver/page.js
          move_replace app/components/DriverNavigationMode.js apps/driver/components/DriverNavigationMode.js

          # Customer booking API implementation belongs to Customer.
          move_replace app/api/_lib/sendBookingEmail.js apps/customer/app/api/_lib/sendBookingEmail.js
          move_replace app/api/bookings/create/route.js apps/customer/app/api/bookings/create/route.js

          # Road-distance implementation is genuinely shared by Customer and Saarthi.
          move_replace app/api/_lib/roadDistance.ts shared/api/roadDistance.ts
          rm -rf -- app/api/route-distance app/api/route-map

          # Rewrite every known moved-module import by resolving from the actual
          # importing file to the actual destination. This handles imports such
          # as ./components/X, ./lib/X, ../../app/components/X, and ../lib/X.
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const targets = new Map([
            ['AccountLink', path.join(root,'shared/components/AccountLink.jsx')],
            ['AuthShell', path.join(root,'shared/components/AuthShell.jsx')],
            ['LiveTripMap', path.join(root,'shared/components/LiveTripMap.js')],
            ['NotificationBell', path.join(root,'shared/components/NotificationBell.jsx')],
            ['PageHeader', path.join(root,'shared/components/PageHeader.jsx')],
            ['PushNotifications', path.join(root,'shared/components/PushNotifications.jsx')],
            ['AuthLanding', path.join(root,'apps/customer/components/AuthLanding.jsx')],
            ['DateTimeBookingGuard', path.join(root,'apps/customer/components/DateTimeBookingGuard.jsx')],
            ['LocationPicker', path.join(root,'apps/customer/components/LocationPicker.jsx')],
            ['MapLocationPicker', path.join(root,'apps/customer/components/MapLocationPicker.jsx')],
            ['supabaseClient', path.join(root,'shared/lib/supabaseClient.js')],
            ['theme', path.join(root,'shared/lib/theme.js')],
            ['contact', path.join(root,'apps/customer/lib/contact.js')],
            ['fareRules', path.join(root,'apps/customer/lib/fareRules.js')],
            ['geofence', path.join(root,'apps/customer/lib/geofence.js')],
            ['googleMaps', path.join(root,'apps/customer/lib/googleMaps.js')],
            ['serviceAreas', path.join(root,'apps/customer/lib/serviceAreas.js')],
            ['tripRules', path.join(root,'apps/customer/lib/tripRules.js')],
          ]);
          const walk = d => fs.readdirSync(d,{withFileTypes:true}).flatMap(e => { const p=path.join(d,e.name); return e.isDirectory()?walk(p):(/\.(js|jsx|ts|tsx)$/.test(e.name)?[p]:[]); });
          const rel = (from,to) => { const r=path.relative(path.dirname(from),to).replaceAll(path.sep,'/'); return r.startsWith('.')?r:`./${r}`; };
          const escape = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

          for (const file of [...walk(path.join(root,'apps')), ...walk(path.join(root,'shared'))]) {
            let text=fs.readFileSync(file,'utf8');
            for (const [name,target] of targets) {
              const e=escape(name);
              const pattern = new RegExp(`(from\\s+["'])(?:\\.{1,2}\\/)+(?:app\\/)?(?:components|lib)\\/${e}(?:\\.[A-Za-z]+)?(["'])`,'g');
              const direct = new RegExp(`(from\\s+["'])\\./${e}(?:\\.[A-Za-z]+)?(["'])`,'g');
              text=text.replace(pattern,(_,p,q)=>`${p}${rel(file,target)}${q}`);
              text=text.replace(direct,(_,p,q)=>`${p}${rel(file,target)}${q}`);
            }
            // Moved files can also have sibling imports such as ./supabaseClient
            // or ./LocationPicker; the basename pass above covers those too.
            fs.writeFileSync(file,text);
          }
          NODE

          # App-owned auth route adapters.
          for app in customer driver; do
            printf 'export { default } from "../../../../shared/auth/login";\n' > "apps/$app/app/login/page.js"
            printf 'export { default } from "../../../../shared/auth/forgot-password";\n' > "apps/$app/app/forgot-password/page.js"
            printf 'export { default } from "../../../../shared/auth/reset-password";\n' > "apps/$app/app/reset-password/page.js"
          done

          # Each deployable app owns its root route.
          printf 'export { default } from "./driver/page";\n' > apps/driver/app/page.js
          printf 'export { default } from "./admin/page";\n' > apps/admin/app/page.js

          # Shared styles are consumed from the repository-level shared layer.
          for app in customer driver admin; do
            perl -0pi -e 's#@import "\.\./\.\./\.\./app/globals\.css";#@import "../../../shared/styles/globals.css";#g; s#@import "\.\./\.\./\.\./app/brand-theme\.css";#@import "../../../shared/styles/brand-theme.css";#g' "apps/$app/styles/globals.css"
          done

          cat > apps/customer/app/api/_lib/roadDistance.ts <<'EOF'
          export { getRoadDistance } from "../../../../../shared/api/roadDistance";
          export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
          EOF
          cat > apps/driver/app/api/_lib/roadDistance.ts <<'EOF'
          export { getRoadDistance } from "../../../../../shared/api/roadDistance";
          export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
          EOF

          rm -rf -- app lib

          # Boundary checks.
          if grep -RInE 'from ["'"'"'](\.{0,2}/)*app/' apps shared --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx'; then echo 'ERROR: stale root app imports remain.'; exit 1; fi
          if grep -RInE 'from ["'"'"'](\.{0,2}/)*lib/' apps shared --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx'; then echo 'ERROR: stale root lib imports remain.'; exit 1; fi
          test ! -d app
          test ! -d lib
          test ! -d apps/web

      - name: Build all three production applications
        shell: bash
        run: |
          set -euo pipefail
          for app in customer driver admin; do
            echo "===== Building apps/$app ====="
            cd "apps/$app"
            npm install --no-audit --no-fund
            npm run build
            cd ../..
          done

      - name: Final dependency and duplication audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'from ["'"'"'](\.{0,2}/)*app/' apps shared --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx'; then echo 'ERROR: stale root app imports remain after builds.'; exit 1; fi
          if grep -RInE 'from ["'"'"'](\.{0,2}/)*lib/' apps shared --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx'; then echo 'ERROR: stale root lib imports remain after builds.'; exit 1; fi
          test ! -d app
          test ! -d lib
          test ! -d apps/web
          test ! -f .github/workflows/voynu-source-separation.yml
          test -f .github/workflows/voynu-source-separation-v2.yml
          test -f apps/customer/package.json
          test -f apps/driver/package.json
          test -f apps/admin/package.json

      - name: Commit verified migration and remove temporary workflows
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/voynu-source-separation.yml .github/workflows/voynu-source-separation-v2.yml
          git add -A
          git commit -m 'refactor: complete three-app source separation' -m 'Move Customer, Saarthi, and Admin source into explicit application boundaries.' -m 'Centralize only genuinely shared UI, authentication, styling, and utilities.' -m 'Require structural, dependency, duplication, and production-build validation before publishing the migration.'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
