name: VOYNU source separation v2

# Temporary one-shot migration. It runs on a same-repository PR or migration-branch push
# so the migration is built and audited before main changes. The verified migration removes this file.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [refactor/verified-source-separation]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/verified-source-separation
          fetch-depth: 0

      - name: Migrate source tree and validate structure
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/page.js ]; then echo "Root source is already separated; no migration required."; exit 0; fi
          test -d app/admin; test -f app/driver/page.js; test -f lib/capacityValidation.js; test -f app/lib/serviceAreas.js; test -f app/lib/supabaseClient.js
          mkdir -p apps/customer/app/api/_lib apps/customer/app/{account,booking-confirmed,cab-selection,signup} apps/customer/{components,lib} apps/admin/app/admin apps/admin/lib apps/driver/app/{driver,api/_lib} apps/driver/{components,lib} shared/{components,lib,styles,api,auth}
          move_replace() { local src="$1" dst="$2"; mkdir -p "$(dirname "$dst")"; rm -rf -- "$dst"; mv -- "$src" "$dst"; }
          for p in account booking-confirmed cab-selection signup; do move_replace "app/$p/page.js" "apps/customer/app/$p/page.js"; done
          move_replace app/page.js apps/customer/app/page.js
          for f in AuthLanding.jsx DateTimeBookingGuard.jsx LocationPicker.jsx MapLocationPicker.jsx; do move_replace "app/components/$f" "apps/customer/components/$f"; done
          for f in contact.js fareRules.js geofence.js googleMaps.js serviceAreas.js tripRules.js; do move_replace "app/lib/$f" "apps/customer/lib/$f"; done
          move_replace lib/capacityValidation.js apps/customer/lib/capacityValidation.js
          for p in login forgot-password reset-password; do move_replace "app/$p/page.js" "shared/auth/$p.js"; done
          for f in AccountLink.jsx AuthShell.jsx LiveTripMap.js NotificationBell.jsx PageHeader.jsx PushNotifications.jsx; do move_replace "app/components/$f" "shared/components/$f"; done
          for f in supabaseClient.js theme.js; do move_replace "app/lib/$f" "shared/lib/$f"; done
          move_replace app/globals.css shared/styles/globals.css
          move_replace app/brand-theme.css shared/styles/brand-theme.css
          mapfile -t admin_files < <(find app/admin -type f -print | sort)
          for src in "${admin_files[@]}"; do move_replace "$src" "apps/admin/app/admin/${src#app/admin/}"; done
          move_replace app/lib/admin.js apps/admin/lib/admin.js
          move_replace app/driver/page.js apps/driver/app/driver/page.js
          move_replace app/components/DriverNavigationMode.js apps/driver/components/DriverNavigationMode.js
          move_replace app/api/_lib/sendBookingEmail.js apps/customer/app/api/_lib/sendBookingEmail.js
          move_replace app/api/bookings/create/route.js apps/customer/app/api/bookings/create/route.js
          move_replace app/api/_lib/roadDistance.ts shared/api/roadDistance.ts
          rm -rf -- app/api/route-distance app/api/route-map
          node <<'NODE'
          const fs=require('fs'),path=require('path'); const root=process.cwd();
          const targets={}; for(const n of ['AccountLink','AuthShell','LiveTripMap','NotificationBell','PageHeader','PushNotifications']) targets[n]=path.join(root,'shared/components',n); for(const n of ['supabaseClient','theme']) targets[n]=path.join(root,'shared/lib',n); for(const n of ['AuthLanding','DateTimeBookingGuard','LocationPicker','MapLocationPicker']) targets[n]=path.join(root,'apps/customer/components',n); for(const n of ['contact','fareRules','geofence','googleMaps','serviceAreas','tripRules']) targets[n]=path.join(root,'apps/customer/lib',n); targets.admin=path.join(root,'apps/admin/lib/admin'); targets.capacityValidation=path.join(root,'apps/customer/lib/capacityValidation'); targets.DriverNavigationMode=path.join(root,'apps/driver/components/DriverNavigationMode');
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const p=path.join(d,e.name);return e.isDirectory()?walk(p):(/\.(js|jsx|ts|tsx)$/.test(e.name)?[p]:[])}); const rel=(from,to)=>{const r=path.relative(path.dirname(from),to).replaceAll(path.sep,'/');return r.startsWith('.')?r:`./${r}`}; const names=Object.keys(targets).filter(n=>!['admin','capacityValidation'].includes(n)); const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          for(const file of [...walk(path.join(root,'apps')),...walk(path.join(root,'shared'))]){let text=fs.readFileSync(file,'utf8'); for(const n of names){const e=esc(n); const patterns=[new RegExp(`(from\\s+)(["'])(?:\\.{1,2}\\/)+(?:app\\/)?(?:components|lib)\\/${e}(?:\\.(?:js|jsx|ts|tsx))?(["'])`,'g'),new RegExp(`(from\\s+)(["'])\\./(?:components|lib)\\/${e}(?:\\.(?:js|jsx|ts|tsx))?(["'])`,'g'),new RegExp(`(from\\s+)(["'])\\./${e}(?:\\.(?:js|jsx|ts|tsx))?(["'])`,'g')]; for(const re of patterns) text=text.replace(re,(_,p,q,r)=>`${p}${q}${rel(file,targets[n])}${r}`)} text=text.replace(/from\s+(["'])(?:\.\.\/)+lib\/admin\1/g,(_,q)=>`from ${q}${rel(file,targets.admin)}${q}`); text=text.replace(/from\s+(["'])(?:\.\.\/)+lib\/capacityValidation\1/g,(_,q)=>`from ${q}${rel(file,targets.capacityValidation)}${q}`); text=text.replace(/from\s+(["'])(?:\.\.\/)+components\/DriverNavigationMode\1/g,(_,q)=>`from ${q}${rel(file,targets.DriverNavigationMode)}${q}`); fs.writeFileSync(file,text)}
          NODE
          for app in customer driver; do printf 'export { default } from "../../../../shared/auth/login";\n' > "apps/$app/app/login/page.js"; printf 'export { default } from "../../../../shared/auth/forgot-password";\n' > "apps/$app/app/forgot-password/page.js"; printf 'export { default } from "../../../../shared/auth/reset-password";\n' > "apps/$app/app/reset-password/page.js"; done
          printf 'export { default } from "./driver/page";\n' > apps/driver/app/page.js
          printf 'export { default } from "./admin/page";\n' > apps/admin/app/page.js
          for app in customer driver admin; do perl -0pi -e 's#@import "\.\./\.\./\.\./app/globals\.css";#@import "../../../shared/styles/globals.css";#g; s#@import "\.\./\.\./\.\./app/brand-theme\.css";#@import "../../../shared/styles/brand-theme.css";#g' "apps/$app/styles/globals.css"; done
          cat > apps/customer/app/api/_lib/roadDistance.ts <<'EOF'
          export { getRoadDistance } from "../../../../../shared/api/roadDistance";
          export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
          EOF
          cat > apps/driver/app/api/_lib/roadDistance.ts <<'EOF'
          export { getRoadDistance } from "../../../../../shared/api/roadDistance";
          export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
          EOF
          rm -rf -- app lib
          node <<'NODE'
          const fs=require('fs'),path=require('path'); const root=process.cwd(); const exts=['','.js','.jsx','.ts','.tsx']; const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const p=path.join(d,e.name);return e.isDirectory()?walk(p):(/\.(js|jsx|ts|tsx)$/.test(e.name)?[p]:[])}); const files=[...walk(path.join(root,'apps')),...walk(path.join(root,'shared'))]; const resolve=(f,s)=>{const b=path.resolve(path.dirname(f),s);for(const x of exts){const p=b+x;if(fs.existsSync(p)&&fs.statSync(p).isFile())return p}for(const x of exts){const p=path.join(b,'index'+x);if(fs.existsSync(p)&&fs.statSync(p).isFile())return p}return null}; let bad=0; const re=/\b(?:from\s*|import\s*\()(["'])(\.\.?\/[^"']+)\1/g; for(const f of files){const t=fs.readFileSync(f,'utf8');let m;while((m=re.exec(t))){const p=resolve(f,m[2]);if(!p){console.error(`MISSING ${path.relative(root,f)} -> ${m[2]}`);bad++}else{const r=path.relative(root,p).replaceAll(path.sep,'/');if(r==='app'||r.startsWith('app/')||r==='lib'||r.startsWith('lib/')){console.error(`LEGACY ROOT ${path.relative(root,f)} -> ${m[2]}`);bad++}}}} if(bad)process.exit(1);
          NODE
          test ! -d app; test ! -d lib; test ! -d apps/web

      - name: Build all three production applications
        shell: bash
        run: |
          set -euo pipefail
          for app in customer driver admin; do cd "apps/$app"; npm install --no-audit --no-fund; npm run build; cd ../..; done

      - name: Final dependency and structure audit
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app; test ! -d lib; test ! -d apps/web
          test ! -f .github/workflows/voynu-source-separation.yml
          test ! -f .github/workflows/voynu-source-separation-v2.yml
          test -f apps/customer/package.json; test -f apps/driver/package.json; test -f apps/admin/package.json
          node <<'NODE'
          const fs=require('fs'),path=require('path'); const root=process.cwd(); const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{if(e.name==='node_modules'||e.name==='.next')return [];const p=path.join(d,e.name);return e.isDirectory()?walk(p):(/\.(js|jsx|ts|tsx)$/.test(e.name)?[p]:[])}); const files=[...walk(path.join(root,'apps')),...walk(path.join(root,'shared'))]; const exts=['','.js','.jsx','.ts','.tsx']; const resolve=(f,s)=>{const b=path.resolve(path.dirname(f),s);for(const x of exts){const p=b+x;if(fs.existsSync(p)&&fs.statSync(p).isFile())return p}for(const x of exts){const p=path.join(b,'index'+x);if(fs.existsSync(p)&&fs.statSync(p).isFile())return p}return null}; let bad=0; const re=/\b(?:from\s*|import\s*\()(["'])(\.\.?\/[^"']+)\1/g; for(const f of files){const t=fs.readFileSync(f,'utf8');let m;while((m=re.exec(t))){if(!resolve(f,m[2])){console.error(`MISSING ${path.relative(root,f)} -> ${m[2]}`);bad++}}} if(bad)process.exit(1);
          NODE

      - name: Commit only after all verification gates pass
        if: ${{ github.repository == 'surfrajahmad91/voynu' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/voynu-source-separation.yml .github/workflows/voynu-source-separation-v2.yml || true
          git add -A
          git commit -m 'refactor: complete three-app source separation' -m 'Move Customer, Saarthi, and Admin source into explicit application boundaries.' -m 'Centralize only genuinely shared UI, authentication, styling, and utilities.' -m 'Require dependency resolution, structural audits, and all three production builds before publishing the migration.'
          git push origin HEAD:refactor/verified-source-separation
