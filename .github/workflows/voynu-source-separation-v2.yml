name: VOYNU source separation v2

# Temporary one-shot migration. It runs on a same-repository PR so the migration
# is built and audited before main changes. The verified migration removes this file.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Migrate source tree and validate structure
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/page.js ]; then
            echo "Root source is already separated; no migration required."
            exit 0
          fi

          test -d app/admin
          test -f app/driver/page.js
          test -f lib/capacityValidation.js
          test -f app/lib/serviceAreas.js
          test -f app/lib/supabaseClient.js

          mkdir -p \
            apps/customer/app/api/_lib \
            apps/customer/app/{account,booking-confirmed,cab-selection,signup} \
            apps/customer/{components,lib} \
            apps/admin/app/admin \
            apps/admin/lib \
            apps/driver/app/{driver,api/_lib} \
            apps/driver/{components,lib} \
            shared/{components,lib,styles,api,auth}

          move_replace() {
            local src="$1" dst="$2"
            mkdir -p "$(dirname "$dst")"
            rm -rf -- "$dst"
            mv -- "$src" "$dst"
          }

          # Customer-owned routes, UI, and business logic.
          for p in account booking-confirmed cab-selection signup; do
            move_replace "app/$p/page.js" "apps/customer/app/$p/page.js"
          done
          move_replace app/page.js apps/customer/app/page.js
          for f in AuthLanding.jsx DateTimeBookingGuard.jsx LocationPicker.jsx MapLocationPicker.jsx; do
            move_replace "app/components/$f" "apps/customer/components/$f"
          done
          for f in contact.js fareRules.js geofence.js googleMaps.js serviceAreas.js tripRules.js; do
            move_replace "app/lib/$f" "apps/customer/lib/$f"
          done
          move_replace lib/capacityValidation.js apps/customer/lib/capacityValidation.js

          # Shared authentication, UI, libraries, and styling.
          for p in login forgot-password reset-password; do
            move_replace "app/$p/page.js" "shared/auth/$p.js"
          done
          for f in AccountLink.jsx AuthShell.jsx LiveTripMap.js NotificationBell.jsx PageHeader.jsx PushNotifications.jsx; do
            move_replace "app/components/$f" "shared/components/$f"
          done
          for f in supabaseClient.js theme.js; do
            move_replace "app/lib/$f" "shared/lib/$f"
          done
          move_replace app/globals.css shared/styles/globals.css
          move_replace app/brand-theme.css shared/styles/brand-theme.css

          # Admin-owned routes and helper.
          mapfile -t admin_files < <(find app/admin -type f -print | sort)
          for src in "${admin_files[@]}"; do
            move_replace "$src" "apps/admin/app/admin/${src#app/admin/}"
          done
          move_replace app/lib/admin.js apps/admin/lib/admin.js

          # Saarthi-owned route and UI.
          move_replace app/driver/page.js apps/driver/app/driver/page.js
          move_replace app/components/DriverNavigationMode.js apps/driver/components/DriverNavigationMode.js

          # Customer booking API implementation.
          move_replace app/api/_lib/sendBookingEmail.js apps/customer/app/api/_lib/sendBookingEmail.js
          move_replace app/api/bookings/create/route.js apps/customer/app/api/bookings/create/route.js

          # One genuinely shared road-distance implementation.
          move_replace app/api/_lib/roadDistance.ts shared/api/roadDistance.ts

          # Existing app-local route handlers remain the application entrypoints.
          rm -rf -- app/api/route-distance app/api/route-map

          # Rewrite moved-module imports using the actual destination of each file.
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const sharedComponents = ['AccountLink','AuthShell','LiveTripMap','NotificationBell','PageHeader','PushNotifications'];
          const sharedLibs = ['supabaseClient','theme'];
          const customerComponents = ['AuthLanding','DateTimeBookingGuard','LocationPicker','MapLocationPicker'];
          const walk = d => fs.readdirSync(d, {withFileTypes:true}).flatMap(e => { const p=path.join(d,e.name); return e.isDirectory()?walk(p):(/\.(js|jsx|ts|tsx)$/.test(e.name)?[p]:[]); });
          const rel = (from,to) => { const r=path.relative(path.dirname(from),to).replaceAll(path.sep,'/'); return r.startsWith('.')?r:`./${r}`; };
          const replaceKnown = (text,name,target) => {
            const e=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
            const old=new RegExp(`(from\\s+["'])(?:\\.\\.?/)+(?:app/)?(?:components|lib)/${e}(?:\\.jsx?|\\.tsx?)?(["'])`,'g');
            const direct=new RegExp(`(from\\s+["'])\\./${e}(?:\\.jsx?|\\.tsx?)?(["'])`,'g');
            return text.replace(old,`$1${target}$2`).replace(direct,`$1${target}$2`);
          };
          for (const file of [...walk(path.join(root,'apps')), ...walk(path.join(root,'shared'))]) {
            let text=fs.readFileSync(file,'utf8');
            for (const n of sharedComponents) text=replaceKnown(text,n,rel(file,path.join(root,'shared/components',n)));
            for (const n of sharedLibs) text=replaceKnown(text,n,rel(file,path.join(root,'shared/lib',n)));
            for (const n of customerComponents) text=replaceKnown(text,n,rel(file,path.join(root,'apps/customer/components',n)));
            text=text.replace(/from\s+["'](?:\.\.\/)+app\/lib\/admin["']/g,`from "${rel(file,path.join(root,'apps/admin/lib/admin'))}"`);
            fs.writeFileSync(file,text);
          }
          NODE

          # Customer and Saarthi expose shared auth through local route adapters.
          for app in customer driver; do
            printf 'export { default } from "../../../../shared/auth/login";\n' > "apps/$app/app/login/page.js"
            printf 'export { default } from "../../../../shared/auth/forgot-password";\n' > "apps/$app/app/forgot-password/page.js"
            printf 'export { default } from "../../../../shared/auth/reset-password";\n' > "apps/$app/app/reset-password/page.js"
          done

          # App roots expose their named application routes.
          printf 'export { default } from "./driver/page";\n' > apps/driver/app/page.js
          printf 'export { default } from "./admin/page";\n' > apps/admin/app/page.js

          # Shared styles are consumed from the repository-level shared layer.
          for app in customer driver admin; do
            perl -0pi -e 's#@import "\.\./\.\./\.\./app/globals\.css";#@import "../../../shared/styles/globals.css";#g; s#@import "\.\./\.\./\.\./app/brand-theme\.css";#@import "../../../shared/styles/brand-theme.css";#g' "apps/$app/styles/globals.css"
          done

          # App-local helpers point to the one shared road-distance implementation.
          cat > apps/customer/app/api/_lib/roadDistance.ts <<'EOF'
          export { getRoadDistance } from "../../../../../shared/api/roadDistance";
          export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
          EOF
          cat > apps/driver/app/api/_lib/roadDistance.ts <<'EOF'
          export { getRoadDistance } from "../../../../../shared/api/roadDistance";
          export type { RoadDistanceResult } from "../../../../../shared/api/roadDistance";
          EOF

          rm -rf -- app lib

          # Resolve every relative JavaScript/TypeScript import from its actual file location.
          # This catches both missing modules and accidental references to the deleted root app/lib.
          node <<'NODE'
          const fs=require('fs'), path=require('path');
          const root=process.cwd();
          const exts=['','.js','.jsx','.ts','.tsx'];
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const p=path.join(d,e.name);return e.isDirectory()?walk(p):(/\.(js|jsx|ts|tsx)$/.test(e.name)?[p]:[])});
          const files=[...walk(path.join(root,'apps')),...walk(path.join(root,'shared'))];
          const resolveImport=(file,spec)=>{
            if(!spec.startsWith('.')) return null;
            const base=path.resolve(path.dirname(file),spec);
            for(const ext of exts){const p=base+ext;if(fs.existsSync(p)&&fs.statSync(p).isFile())return p;}
            for(const ext of exts){const p=path.join(base,'index'+ext);if(fs.existsSync(p)&&fs.statSync(p).isFile())return p;}
            return null;
          };
          let bad=0;
          const re=/\b(?:from\s*|import\s*\()(["'])(\.\.?\/[^"']+)\1/g;
          for(const file of files){
            const text=fs.readFileSync(file,'utf8'); let m;
            while((m=re.exec(text))){
              const resolved=resolveImport(file,m[2]);
              if(!resolved){console.error(`MISSING ${path.relative(root,file)} -> ${m[2]}`);bad++;continue;}
              const r=path.relative(root,resolved).replaceAll(path.sep,'/');
              if(r==='app'||r.startsWith('app/')||r==='lib'||r.startsWith('lib/')){console.error(`ROOT SOURCE ${path.relative(root,file)} -> ${m[2]} => ${r}`);bad++;}
            }
          }
          if(bad) process.exit(1);
          NODE

          test ! -d app
          test ! -d lib
          test ! -d apps/web

          for d in apps/customer/app apps/customer/components apps/customer/lib apps/customer/public apps/customer/styles \
                   apps/driver/app apps/driver/components apps/driver/lib apps/driver/public apps/driver/styles \
                   apps/admin/app apps/admin/lib apps/admin/public apps/admin/styles \
                   shared/components shared/lib shared/styles shared/api shared/auth; do
            test -d "$d"
          done

      - name: Build all three production applications
        shell: bash
        run: |
          set -euo pipefail
          for app in customer driver admin; do
            echo "===== Building apps/$app ====="
            cd "apps/$app"
            npm install --no-audit --no-fund
            npm run build
            cd ../..
          done

      - name: Final dependency and structure audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'), path=require('path');
          const root=process.cwd();
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const p=path.join(d,e.name);return e.isDirectory()?walk(p):(/\.(js|jsx|ts|tsx)$/.test(e.name)?[p]:[])});
          const files=[...walk(path.join(root,'apps')),...walk(path.join(root,'shared'))];
          let bad=0;
          for(const file of files){
            const text=fs.readFileSync(file,'utf8');
            for(const line of text.split(/\r?\n/)){
              if(/from\s*["'](?:\.\.\/)+app\//.test(line)||/from\s*["'](?:\.\.\/)+lib\//.test(line)){console.error(`STALE ${path.relative(root,file)}: ${line.trim()}`);bad++;}
            }
          }
          if(bad)process.exit(1);
          NODE
          test ! -d app
          test ! -d lib
          test ! -d apps/web
          test ! -f .github/workflows/voynu-source-separation.yml
          test -f apps/customer/package.json
          test -f apps/driver/package.json
          test -f apps/admin/package.json

      - name: Commit only after all verification gates pass
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/voynu-source-separation.yml .github/workflows/voynu-source-separation-v2.yml
          git add -A
          git commit -m 'refactor: complete three-app source separation' \
            -m 'Move Customer, Saarthi, and Admin source into explicit application boundaries.' \
            -m 'Centralize only genuinely shared UI, authentication, styling, and utilities.' \
            -m 'Require dependency resolution, structural audits, and all three production builds before publishing the migration.'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
