<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2337">
<title>VOYNU</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:#0A2337;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  img{width:60px;height:60px;border-radius:16px}
  h1{margin:8px 0 0;font-size:20px}
  p{margin:0;max-width:300px;font-size:13px;line-height:1.5;color:rgba(255,255,255,.75)}
  button{margin-top:14px;min-height:44px;padding:0 28px;border:0;border-radius:14px;background:linear-gradient(135deg,#12A0C6,#0A7FA6);color:#fff;font-size:14px;font-weight:700}
</style>
</head>
<body>
  <img src="icon.svg" alt="VOYNU">
  <h1>You're offline</h1>
  <p>VOYNU needs an internet connection to book rides. Check your connection and try again.</p>
  <button type="button" onclick="location.href='https://voynu.vercel.app'">Try again</button>
</body>
</html>
